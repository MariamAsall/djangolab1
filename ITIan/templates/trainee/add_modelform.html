{% extends 'base.html' %}

{% block content %}
<div class="container mt-4">
    <h2>Add New Trainee (using ModelForm)</h2>
    <hr>
    
    <form method="POST" enctype="multipart/form-data" class="form-control">
        {% csrf_token %}
        
        {{ form.as_p }}
        
        <button type="submit" class="btn btn-success">Save Trainee</button>
        <a href="{% url 'traineelist' %}" class="btn btn-secondary">Back to List</a>
    </form>
</div>
{% endblock %}
