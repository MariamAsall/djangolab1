{% extends 'base.html' %}

{% block content %}
    <h2>Update Course</h2>
    <form method="POST">
        {% csrf_token %}
        <label>Name:</label><br>
        <input type="text" name="name" value="{{ course.name }}" required><br>
        <label>Description:</label><br>
        <textarea name="description">{{ course.description }}</textarea><br><br>
        <button type="submit">Update Course</button>
    </form>
{% endblock %}
