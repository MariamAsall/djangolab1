{% extends 'base.html' %}

{% block content %}
    <h2>Add New Course</h2>
    <form method="POST">
        {% csrf_token %}
        <label>Name:</label><br>
        <input type="text" name="name" required><br>
        <label>Description:</label><br>
        <textarea name="description"></textarea><br><br>
        <button type="submit">Save Course</button>
    </form>
{% endblock %}
